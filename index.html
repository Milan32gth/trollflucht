<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<title>Trollflucht</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10151b;color:#f1f4ec;font-family:system-ui,Segoe UI,sans-serif}.wrap{width:min(960px,96vw)}header{display:flex;align-items:end;justify-content:space-between;margin:0 0 12px;gap:20px}h1{font-size:clamp(1.5rem,4vw,2.5rem);margin:0;letter-spacing:-.04em}header p{margin:4px 0 0;color:#aab6b2}.stats{display:flex;gap:12px;align-items:center;color:#d9e1da;font-weight:700}.pill{background:#202a2f;border:1px solid #344449;border-radius:999px;padding:8px 14px}.path{display:flex;align-items:center;gap:0;margin:0 0 12px;padding:9px 14px;background:#1a2428;border:1px solid #344449;border-radius:12px;overflow-x:auto}.path-label{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:#96a89d;font-weight:800;margin-right:14px;white-space:nowrap}.node{position:relative;flex:1;min-width:36px;border:0;background:none;color:#7c8982;padding:0;cursor:pointer;font-weight:900}.node:before{content:'';position:absolute;left:-50%;top:13px;width:100%;height:3px;background:#3c4942;z-index:0}.node:first-of-type:before{display:none}.node span{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;margin:auto;border:2px solid #536157;border-radius:50%;background:#202a2f}.node.done:before{background:#91c85b}.node.done span{border-color:#91c85b;background:#91c85b;color:#192116}.node.current span{border-color:#fff2a6;box-shadow:0 0 0 4px #fff2a633;color:#fff2a6}.node.locked{cursor:not-allowed;opacity:.48}canvas{width:100%;height:auto;display:block;background:#b9d4c0;border:2px solid #52645d;border-radius:14px;box-shadow:0 18px 60px #0008;image-rendering:pixelated}.help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#9eaaa6;font-size:.9rem;margin-top:10px}.help b{color:#e5eadf}.touch-controls{display:none}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#0a0f13aa}.card{max-width:460px;margin:20px;padding:28px;background:#1a2428;border:1px solid #47594f;border-radius:18px;text-align:center;box-shadow:0 20px 80px #0009}.card h2{font-size:2rem;margin:0 0 8px}.card p{color:#bdc9c0}.card button{border:0;border-radius:10px;background:#b2e36f;color:#192116;font-weight:900;padding:12px 20px;font-size:1rem;cursor:pointer}.touch-btn{width:64px;height:64px;border:1px solid #ffffff66;border-radius:21px;background:#17231dcc;color:#f2f4e9;font-size:1.7rem;font-weight:900;box-shadow:0 6px 18px #0006;touch-action:none;user-select:none;-webkit-user-select:none}.touch-btn:active{background:#8fbf55;color:#182016;transform:scale(.96)}
@media (pointer:coarse){body{display:block;padding:12px 12px 100px}.wrap{width:min(960px,100%);margin:0 auto}.touch-controls{display:flex;justify-content:space-between;align-items:end;position:fixed;left:0;right:0;bottom:12px;z-index:4;padding:0 18px;pointer-events:none}.touch-group{display:flex;gap:12px;pointer-events:auto}.touch-btn{pointer-events:auto}button{touch-action:manipulation}}
@media (pointer:coarse) and (orientation:landscape) and (max-height:500px){body{padding:0;overflow:hidden}.wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);margin:0}header,.path,.help{display:none}canvas{border-radius:0;border-left:0;border-right:0;max-height:100vh}.touch-controls{bottom:8px;padding:0 12px}.touch-btn{width:58px;height:58px;border-radius:18px;background:#17231db0}}
.credit{margin-top:8px;text-align:center;color:#87958f;font-size:.8rem;letter-spacing:.04em}@media (pointer:coarse) and (orientation:landscape) and (max-height:500px){.credit{position:fixed;left:0;right:0;bottom:4px;z-index:5;margin:0;color:#fff;text-align:center;text-shadow:0 1px 5px #000;pointer-events:none}}</style></head>
<body><main class="wrap"><header><div><h1>🍄 Trollflucht</h1><p>Der Ausgang ist nah. Ganz bestimmt. 😈</p></div><div class="stats"><span class="pill">💀 <span id="deaths">0</span></span><span class="pill" id="level">Level 1 / 6</span></div></header><nav class="path" id="path" aria-label="Levelpfad"></nav><canvas id="game" width="960" height="540" aria-label="Trollflucht Spiel"></canvas><div class="help"><span><b>← →</b> laufen · <b>Leertaste / ↑</b> springen</span><span><b>R</b> Neustart · Sammle den Schlüssel und finde den Ausgang</span></div><div class="credit">von Milan</div></main><div class="touch-controls" aria-label="Touch-Steuerung"><div class="touch-group"><button class="touch-btn" data-key="ArrowLeft" aria-label="Nach links">◀</button><button class="touch-btn" data-key="ArrowRight" aria-label="Nach rechts">▶</button></div><div class="touch-group"><button class="touch-btn" data-key="Space" aria-label="Springen">⤒</button></div></div><div class="overlay" id="overlay"><div class="card"><h2 id="title"></h2><p id="message"></p><button id="button">Weiter</button></div></div>
<script>
const c=document.querySelector('#game'),ctx=c.getContext('2d'),overlay=document.querySelector('#overlay');
const levels=[
 {start:[55,430],exit:[900,420],key:[485,365], platforms:[[0,490,960,50],[145,420,110,18],[300,350,105,18],[455,405,110,18],[620,330,110,18],[790,420,100,18]], spikes:[[270,478,46],[410,478,55],[565,478,44],[740,478,40]], fake:[{x:145,y:420,w:110,h:18,trigger:235}], sign:'Der Boden sieht sicher aus…'},
 {start:[55,430],exit:[900,285],key:[510,260], platforms:[[0,490,960,50],[130,410,110,18],[285,335,105,18],[440,275,110,18],[610,345,105,18],[780,285,105,18]], spikes:[[240,478,65],[400,478,65],[580,478,60],[735,478,65]], fake:[{x:440,y:275,w:110,h:18,trigger:515}], sign:'Oben wartet bestimmt nichts…'},
 {start:[55,430],exit:[900,420],key:[650,255], platforms:[[0,490,960,50],[120,405,100,18],[270,330,100,18],[420,255,100,18],[570,330,100,18],[720,405,100,18],[835,330,90,18]], spikes:[[225,478,55],[375,478,55],[525,478,55],[680,478,55]], fake:[{x:270,y:330,w:100,h:18,trigger:325},{x:720,y:405,w:100,h:18,trigger:775}], sign:'Fast geschafft. FAST.'}
];
levels.push(
 {start:[55,430],exit:[900,420],key:[540,300],platforms:[[0,490,960,50],[120,420,110,18],[280,350,110,18],[450,405,105,18],[610,330,110,18],[780,400,100,18]],spikes:[[235,478,60],[405,478,58],[560,478,62],[735,478,45]],fake:[{x:280,y:350,w:110,h:18,trigger:340}],sign:'Ganz normaler Boden.'},
 {start:[55,430],exit:[900,330],key:[710,270],platforms:[[0,490,960,50],[130,410,110,18],[290,330,100,18],[445,260,110,18],[610,350,100,18],[780,330,105,18]],spikes:[[245,478,65],[405,478,60],[575,478,65],[735,478,55]],fake:[{x:445,y:260,w:110,h:18,trigger:500}],sign:'Der Ausgang bewegt sich nie.'},
 {start:[55,430],exit:[900,420],key:[480,290],platforms:[[0,490,960,50],[110,405,110,18],[265,330,105,18],[420,390,110,18],[580,315,105,18],[735,390,110,18],[850,330,75,18]],spikes:[[220,478,48],[375,478,45],[535,478,48],[690,478,48],[830,478,28]],fake:[{x:110,y:405,w:110,h:18,trigger:175},{x:580,y:315,w:105,h:18,trigger:640}],sign:'Nur noch ein kleines Stück!'}
);
let lv=0,maxUnlocked=0,deaths=0,keys={},player,platforms,trapTimers=[],keyGot=false,won=false,toast='',toastTime=0;
function drawPath(){const nav=document.querySelector('#path');nav.innerHTML='<span class="path-label">Levelpfad</span>'+levels.map((_,i)=>'<button class="node '+(i<=maxUnlocked?'done':'locked')+' '+(i===lv?'current':'')+'" '+(i>maxUnlocked?'disabled':'')+' aria-label="Level '+(i+1)+'" title="Level '+(i+1)+'" data-level="'+i+'"><span>'+(i<maxUnlocked?'✓':i+1)+'</span></button>').join('');nav.querySelectorAll('.node:not(.locked)').forEach(b=>b.onclick=()=>{lv=+b.dataset.level;load()})}
function load(){let L=levels[lv];player={x:L.start[0],y:L.start[1],w:28,h:38,vx:0,vy:0,on:false};platforms=L.platforms.map(p=>({x:p[0],y:p[1],w:p[2],h:p[3],gone:false}));trapTimers=[];keyGot=false;won=false;document.querySelector('#level').textContent=`Level ${lv+1} / ${levels.length}`;drawPath();overlay.style.display='none'}
function message(title,msg,button,action){document.querySelector('#title').textContent=title;document.querySelector('#message').textContent=msg;document.querySelector('#button').textContent=button;document.querySelector('#button').onclick=action;overlay.style.display='grid'}
function die(){if(won||overlay.style.display==='grid')return;deaths++;document.querySelector('#deaths').textContent=deaths;load();toast='HA! Nochmal!';toastTime=90}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function draw(){let L=levels[lv];ctx.clearRect(0,0,960,540);let sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#cde2c7');sky.addColorStop(1,'#9cbdac');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);
 // distant hills
 ctx.fillStyle='#a1c1a3';ctx.beginPath();ctx.moveTo(0,375);for(let x=0;x<=960;x+=80)ctx.lineTo(x,330+Math.sin(x*.018+lv)*38);ctx.lineTo(960,490);ctx.lineTo(0,490);ctx.fill();
 // clouds
 for(let i=0;i<4;i++){let x=(i*275+80)%1000;ctx.fillStyle='#eef4df99';ctx.beginPath();ctx.arc(x,75+i%2*38,25,0,7);ctx.arc(x+26,73+i%2*38,32,0,7);ctx.arc(x+57,79+i%2*38,22,0,7);ctx.fill()}
 // terrain and platforms
 for(const p of platforms){if(p.gone)continue;rect(p.x,p.y,p.w,p.h,'#586d54');rect(p.x,p.y,p.w,5,'#8ead6c');rect(p.x,p.y+5,p.w,p.h-5,'#596d53')}
 // spikes
 for(const s of L.spikes){ctx.fillStyle='#39483e';for(let x=s[0];x<s[0]+s[1];x+=16){ctx.beginPath();ctx.moveTo(x,490);ctx.lineTo(x+8,472);ctx.lineTo(x+16,490);ctx.fill()}}
 // exit
 const ex=L.exit[0];rect(ex, L.exit[1]-48,10,68,'#6b5542');rect(ex+9,L.exit[1]-44,42,64,'#ddcc92');ctx.fillStyle='#ffe99b';ctx.beginPath();ctx.arc(ex+30,L.exit[1]-16,19,Math.PI*1.5,Math.PI*.5);ctx.fill();ctx.fillStyle='#4d4734';ctx.fillText('EXIT',ex+12,L.exit[1]-53);
 // key
 if(!keyGot){let t=Date.now()/220;ctx.save();ctx.translate(L.key[0],L.key[1]+Math.sin(t)*4);ctx.strokeStyle='#f5bf47';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.moveTo(10,0);ctx.lineTo(28,0);ctx.lineTo(28,7);ctx.moveTo(21,0);ctx.lineTo(21,6);ctx.stroke();ctx.restore()}
 // trap timer platforms wink before falling
 for(const f of L.fake){let p=platforms.find(p=>p.x===f.x&&p.y===f.y);if(p&&!p.gone){ctx.fillStyle=trapTimers.some(t=>t.f===f)?'#d77a58':'#779261';ctx.fillRect(f.x,f.y,f.w,5)}}
 // player
 rect(player.x+5,player.y+10,19,25,'#596c39');rect(player.x+3,player.y,23,20,'#77994a');rect(player.x+1,player.y+6,27,12,'#719444');rect(player.x+8,player.y+8,4,6,'#f8f2db');rect(player.x+18,player.y+8,4,6,'#f8f2db');rect(player.x+9,player.y+10,2,3,'#263327');rect(player.x+19,player.y+10,2,3,'#263327');rect(player.x+12,player.y+17,8,2,'#3d3c2b');rect(player.x+5,player.y+32,8,6,'#3f4834');rect(player.x+17,player.y+32,8,6,'#3f4834');
 // sign
 if(lv===0){rect(52,425,4,40,'#655242');rect(28,408,53,24,'#e7d8a3');ctx.fillStyle='#45483a';ctx.font='12px system-ui';ctx.fillText('GO →',36,424)}
 if(toastTime>0){toastTime--;ctx.fillStyle='#18231dde';ctx.fillRect(390,22,180,42);ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText(toast,480,50);ctx.textAlign='left'}
 }
function update(){if(overlay.style.display==='grid'){draw();requestAnimationFrame(update);return}let L=levels[lv];let dir=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);player.vx=dir*3.7;if((keys.Space||keys.ArrowUp||keys.KeyW)&&player.on){player.vy=-11;player.on=false}player.vy=Math.min(player.vy+.52,13);player.x=Math.max(0,Math.min(932,player.x+player.vx));let oldY=player.y;player.y+=player.vy;player.on=false;
 // platforms collisions
 for(const p of platforms){if(p.gone)continue;if(player.vy>=0&&oldY+player.h<=p.y+3&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.on=true}}
 // fake platforms spring trap after landing
 for(const f of L.fake){const p=platforms.find(p=>p.x===f.x&&p.y===f.y);if(p&&!p.gone&&player.on&&player.y+player.h===p.y&&!trapTimers.some(t=>t.f===f)){trapTimers.push({f,t:34});toast='Uh oh…';toastTime=35}}
 for(let i=trapTimers.length-1;i>=0;i--){let t=trapTimers[i];t.t--;if(t.t<=0){let p=platforms.find(p=>p.x===t.f.x&&p.y===t.f.y);if(p)p.gone=true;trapTimers.splice(i,1)}}
 // hazard
 if(player.y>560||L.spikes.some(s=>player.x+player.w>s[0]&&player.x<s[0]+s[1]&&player.y+player.h>470))die();
 // key pickup
 if(!keyGot&&Math.hypot(player.x+14-L.key[0],player.y+18-L.key[1])<34){keyGot=true;toast='Schlüssel!';toastTime=70}
 // exit requires key
 if(player.x+player.w>L.exit[0]&&player.x<L.exit[0]+54&&player.y+player.h>L.exit[1]-48&&player.y<L.exit[1]+22){if(keyGot){if(lv<levels.length-1){maxUnlocked=Math.max(maxUnlocked,lv+1);lv++;load();toast='Level geschafft!';toastTime=75}else{won=true;maxUnlocked=lv;drawPath();message('Du hast gewonnen!','Du hast den ganzen Levelpfad geschafft. Gestorben bist du '+deaths+' Mal.','Nochmal spielen',()=>{lv=0;deaths=0;maxUnlocked=0;document.querySelector('#deaths').textContent=0;load()})}}else{toast='Erst den Schlüssel holen!';toastTime=65}}
 draw();requestAnimationFrame(update)}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyR'){load();toast='Neustart';toastTime=50}});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('.touch-btn').forEach(b=>{const press=e=>{e.preventDefault();keys[b.dataset.key]=true;b.setPointerCapture?.(e.pointerId)};const release=e=>{e.preventDefault();keys[b.dataset.key]=false};b.addEventListener('pointerdown',press);b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));load();update();
</script></body></html>
